<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Briefing</title>
<meta name="description" content="A personal daily-routine dashboard: habits, strength training, cardio, a poem, a verse, qigong, French practice, and a daily crossword, all in one page.">
<meta name="theme-color" content="#17324f">
<meta property="og:title" content="Daily Briefing">
<meta property="og:description" content="A personal daily-routine dashboard: habits, strength training, cardio, a poem, a verse, qigong, French practice, and a daily crossword, all in one page.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%2317324f%22/><path d=%22M28 52 L44 68 L74 34%22 stroke=%22%23d8ab5f%22 stroke-width=%229%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --bg: #f0efe9;
    --surface: #ffffff;
    --surface-soft: #f7f5f0;
    --border: #e1ddd0;
    --ink: #17160f;
    --ink-soft: #6b6656;
    --ink-faint: #a49e8b;
    --accent: #17324f;
    --accent-2: #a97b2f;
    --accent-2-wash: #f3e6cf;
    --accent-dark: #0d1f33;
    --accent-wash: #e7edf1;
    --success: #2f6b4f;
    --success-wash: #e5f0e9;
    --bad: #a3352b;
    --bad-wash: #f6e6e4;
    --shadow: 0 1px 2px rgba(23,22,15,0.06), 0 1px 1px rgba(23,22,15,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12131a; --surface: #1b1c24; --surface-soft: #21222b; --border: #33343e;
      --ink: #eeece4; --ink-soft: #aaa79a; --ink-faint: #726e60;
      --accent: #6f9bc4; --accent-2: #d8ab5f; --accent-2-wash: #33291a;
      --accent-dark: #0d1f33; --accent-wash: #1b2b3a;
      --success: #57b487; --success-wash: #15301f;
      --bad: #e0776a; --bad-wash: #341814;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 1px 1px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12131a; --surface: #1b1c24; --surface-soft: #21222b; --border: #33343e;
    --ink: #eeece4; --ink-soft: #aaa79a; --ink-faint: #726e60;
    --accent: #6f9bc4; --accent-2: #d8ab5f; --accent-2-wash: #33291a;
    --accent-dark: #0d1f33; --accent-wash: #1b2b3a;
    --success: #57b487; --success-wash: #15301f;
    --bad: #e0776a; --bad-wash: #341814;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 1px 1px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh; padding: 20px 16px 56px;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .navbar {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff; border-radius: 6px; padding: 20px 24px;
    display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px;
    box-shadow: var(--shadow);
  }
  .navbar-eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.14em; opacity: 0.65; font-family: "IBM Plex Mono", monospace; margin-bottom: 4px; }
  .navbar h1 { font-family: "Fraunces", Georgia, serif; font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .navbar .navsub { font-size: 12.5px; opacity: 0.8; margin-top: 5px; font-family: "IBM Plex Mono", monospace; }
  .navbar .date { font-size: 12.5px; opacity: 0.75; font-family: "IBM Plex Mono", monospace; text-align: right; }

  .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .span-1 { grid-column: span 1; }
  .span-2 { grid-column: span 2; }
  .span-4 { grid-column: span 4; }
  @media (max-width: 860px) { .dashboard { grid-template-columns: repeat(2, 1fr); } .span-4 { grid-column: span 2; } }
  @media (max-width: 520px) { .dashboard { grid-template-columns: 1fr; } .span-1, .span-2, .span-4 { grid-column: span 1; } }

  .section-eyebrow {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-faint); padding: 4px 2px 0; display: flex; align-items: center; gap: 10px;
  }
  .section-eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: var(--shadow); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .tile-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); }

  .stat-num { font-family: "IBM Plex Mono", monospace; font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent-2); line-height: 1; }
  .stat-sub { font-size: 12.5px; color: var(--ink-soft); }
  .stat-bar { height: 7px; border-radius: 999px; background: var(--surface-soft); overflow: hidden; margin-top: 2px; }
  .stat-bar-fill { height: 100%; background: var(--accent-2); border-radius: 999px; width: 0%; transition: width 0.4s ease; }
  @media (prefers-reduced-motion: reduce) { .stat-bar-fill { transition: none; } }
  .history { display: flex; gap: 4px; align-items: flex-end; flex: 1; }
  .history .day { flex: 1; height: 30px; border-radius: 3px; background: var(--surface-soft); }
  .history .day[data-ratio="full"] { background: var(--success); }
  .history .day[data-ratio="mid"] { background: var(--accent-2); opacity: 0.6; }
  .history .day[data-ratio="low"] { background: var(--accent-2); opacity: 0.28; }
  .history .day.today { box-shadow: inset 0 0 0 2px var(--accent-dark); }

  .chk-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; -webkit-tap-highlight-color: transparent; overflow: hidden; }
  .chk-box { flex: none; width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--ink-faint); display: flex; align-items: center; justify-content: center; }
  .chk-box svg { width: 11px; height: 11px; opacity: 0; }
  .chk-box.done { background: var(--success); border-color: var(--success); }
  .chk-box.done svg { opacity: 1; }
  .chk-emoji { font-size: 15px; }
  .chk-text { font-size: 14px; font-weight: 500; }
  .chk-row:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .content-head { display: flex; align-items: center; gap: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .content-head .title { font-size: 15px; font-weight: 600; }
  .content-head .emoji { font-size: 17px; }
  .content-body { overflow: hidden; }

  button.btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--accent);
    border-radius: 5px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  button.btn:hover { background: var(--accent-wash); }
  button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.btn.primary:hover { opacity: 0.92; }

  a.btn-link {
    display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff;
    border-radius: 5px; padding: 8px 14px; font-size: 13px; font-weight: 600; text-decoration: none;
  }
  a.btn-link:hover { opacity: 0.9; }

  .poem-title { font-family: "Fraunces", Georgia, serif; font-size: 18px; font-weight: 600; margin: 4px 0 0; }
  .poem-author { font-size: 12px; color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; margin-bottom: 6px; }
  .poem-body { font-family: "Fraunces", Georgia, serif; font-size: 15px; line-height: 1.7; white-space: pre-line; }
  .verse-body { font-family: "Fraunces", Georgia, serif; font-size: 15.5px; line-height: 1.7; font-style: italic; }
  .verse-ref { font-size: 12.5px; color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; font-style: normal; margin-top: 4px; }

  .stretch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 10px; margin-top: 4px; }
  .qi-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .qi-head { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; font-weight: 500; }
  .qi-num { font-family: "IBM Plex Mono", monospace; color: var(--accent-2); font-size: 12px; font-weight: 700; flex: none; }
  .qi-head .dur { margin-left: auto; font-family: "IBM Plex Mono", monospace; color: var(--ink-soft); font-size: 12px; font-weight: 400; }
  .qi-cue { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin-top: 3px; padding-left: 20px; }
  .note { font-size: 11.5px; color: var(--ink-faint); }

  /* ---------- Strength / Cardio tiles ---------- */
  .lift-note { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  .cd-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.55; }
  .cardio-options { display: flex; flex-direction: column; margin-top: 6px; }

  .xw-link-card {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--accent-wash); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px;
  }
  .xw-link-card .xw-lc-title { font-weight: 600; font-size: 14px; }
  .xw-link-card .xw-lc-sub { font-size: 12px; color: var(--ink-soft); }
  .xw-grid { display: grid; grid-template-columns: repeat(5, 36px); grid-template-rows: repeat(5, 36px); gap: 3px; }
  .xw-cell { position: relative; }
  .xw-cell.blocked { background: transparent; }
  .xw-cell input {
    width: 100%; height: 100%; text-align: center; font-size: 16px; font-weight: 600; text-transform: uppercase;
    background: var(--surface-soft); border: 1px solid var(--border); border-radius: 3px;
    color: var(--ink); padding: 0; font-family: "IBM Plex Mono", monospace;
  }
  .xw-cell input:focus { border-color: var(--accent); outline: none; }
  .xw-cell input.correct { background: var(--success-wash); border-color: var(--success); }
  .xw-cell input.incorrect { border-color: var(--bad); }
  .xw-num { position: absolute; top: 1px; left: 2px; font-size: 8px; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; pointer-events: none; }
  .xw-clues { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
  .xw-clues b { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-top: 6px; }
  .xw-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .xw-actions { display: flex; gap: 8px; align-items: center; }
  .xw-status { font-size: 12.5px; color: var(--success); font-weight: 600; }

  .fr-level { display: inline-block; background: var(--accent-2-wash); color: var(--accent-2); font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
  .fr-title { font-weight: 600; font-size: 15px; margin: 2px 0 4px; }
  .fr-text { font-size: 14.5px; line-height: 1.6; }
  .fr-grammar { font-size: 12.5px; background: var(--surface-soft); border-left: 3px solid var(--accent); padding: 7px 10px; margin-top: 8px; border-radius: 0 4px 4px 0; color: var(--ink-soft); }
  .fr-grammar b { color: var(--ink); }
  .fr-translation { font-size: 13px; color: var(--ink-soft); line-height: 1.55; margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border); }
  .fr-translation.hidden { display: none; }
  .fr-actions { display: flex; gap: 8px; margin-top: 8px; }
  .fr-vocab { display: flex; flex-direction: column; }
  .fr-vocab-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .fr-vocab-row:last-child { border-bottom: none; }
  .fr-vocab-row .fr-word { font-weight: 500; }
  .fr-vocab-row .fr-en { color: var(--ink-soft); }

  .fact-text { font-size: 14px; line-height: 1.55; }
  .fact-actions { display: flex; justify-content: flex-end; }

  #tile-completed { display: none; }
  #tile-completed.show { display: flex; }
  .done-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .done-chip {
    display: flex; align-items: center; gap: 6px; background: var(--surface-soft); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 10px 5px 8px; font-size: 12.5px; cursor: pointer;
  }
  .done-chip:hover { background: var(--success-wash); }
  .done-chip .dc-check { color: var(--success); font-size: 13px; }
  .done-chip .dc-text { color: var(--ink-soft); text-decoration: line-through; }

  /* ---------- Tabs / History ---------- */
  .tabbar { display: flex; gap: 6px; }
  .tab-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink-soft);
    border-radius: 5px; padding: 7px 16px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab-btn:hover:not(.active) { background: var(--accent-wash); }
  .hist-day {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: var(--shadow); padding: 12px 16px; margin-bottom: 10px;
  }
  .hist-day-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .hist-day-date { font-weight: 600; font-size: 14px; }
  .hist-day-count { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--ink-soft); }
  .hist-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .hist-chip {
    display: flex; align-items: center; gap: 5px; background: var(--success-wash); color: var(--success);
    border-radius: 999px; padding: 4px 9px; font-size: 12px; font-weight: 500;
  }
  .hist-empty { font-size: 13px; color: var(--ink-faint); font-style: italic; }

  /* ---------- Auth ---------- */
  .auth-gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .auth-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); padding: 32px 28px; max-width: 360px; text-align: center;
  }
  .auth-card .navbar-eyebrow { color: var(--ink-faint); }
  .auth-card h1 { font-family: "Fraunces", Georgia, serif; font-size: 22px; font-weight: 600; margin: 8px 0 10px; }
  .auth-card p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 20px; }
  .auth-card button.btn.primary { width: 100%; padding: 11px; font-size: 14px; }
  .account-row { display: flex; align-items: center; gap: 10px; }
  .account-email { font-size: 12px; opacity: 0.75; font-family: "IBM Plex Mono", monospace; }
  .btn-ghost-light {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff;
    border-radius: 5px; padding: 5px 11px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .btn-ghost-light:hover { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="navbar-eyebrow">Daily Briefing</div>
    <h1>Sign in to continue</h1>
    <p>Your habits, streak, and history sync across every device you sign into.</p>
    <button class="btn primary" id="googleSignInBtn" type="button">Sign in with Google</button>
    <div class="note" id="authError" style="margin-top:12px;"></div>
  </div>
</div>

<div class="page" id="pageRoot" style="display:none;">
  <div class="navbar">
    <div>
      <div class="navbar-eyebrow">Daily Briefing</div>
      <h1 id="greeting">Good morning.</h1>
      <div class="navsub" id="navSub"></div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
      <div class="date" id="dateLine"></div>
      <div class="account-row"><span class="account-email" id="accountEmail"></span><button class="btn-ghost-light" id="signOutBtn" type="button">Sign out</button></div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab-btn active" id="tabToday" type="button">Today</button>
    <button class="tab-btn" id="tabHistory" type="button">History</button>
  </div>

  <div class="dashboard" id="view-today">
    <div class="tile span-1">
      <div class="tile-label">Today</div>
      <div class="stat-num"><span id="doneCount">0</span><span style="font-size:16px;color:var(--ink-faint);">/<span id="totalCount">14</span></span></div>
      <div class="stat-bar"><div class="stat-bar-fill" id="barFill"></div></div>
    </div>
    <div class="tile span-1">
      <div class="tile-label">Streak</div>
      <div class="stat-num" id="streakNum">0</div>
      <div class="stat-sub">days complete</div>
    </div>
    <div class="tile span-2">
      <div class="tile-label">Last 14 days</div>
      <div class="history" id="history"></div>
    </div>

    <div class="section-eyebrow span-4">Physical performance</div>
    <div class="tile span-2" id="tile-strength"></div>
    <div class="tile span-2" id="tile-cardio"></div>
    <div class="tile span-4" id="tile-stretch"></div>

    <div class="section-eyebrow span-4">Mind &amp; spirit</div>
    <div class="tile span-2" id="tile-poem"></div>
    <div class="tile span-2" id="tile-verse"></div>
    <div class="tile span-2" id="tile-french"></div>
    <div class="tile span-2" id="tile-crossword"></div>
    <div class="tile span-2" id="tile-fact"></div>
    <div class="tile span-2" id="tile-checklist"></div>

    <div class="tile span-4" id="tile-completed">
      <div class="tile-label">Completed today</div>
      <div class="done-list" id="doneList"></div>
    </div>
  </div>

  <div id="view-history" class="history-view" style="display:none;">
    <div class="tile-label" style="margin-bottom:8px;">Past days</div>
    <div id="historyList"></div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = "morning-ledger-v7";
  var IDX_KEY = "morning-ledger-idx-v7";
  var CARDIO_LOG_KEY = "morning-ledger-cardio-log-v1";

  var ALL_TASK_IDS = ["make-bed","shower","pray","book","journal","poem","french","crossword","fact","stretch","lift","cardio","diet","creatine"];

  var TASK_META = {
    "make-bed": { emoji: "🛏️", label: "Make bed" },
    "shower":   { emoji: "🚿", label: "Shower" },
    "pray":     { emoji: "🙏", label: "Pray" },
    "book":     { emoji: "📖", label: "Read a book" },
    "journal":  { emoji: "📓", label: "Journal" },
    "poem":     { emoji: "📜", label: "Read a poem" },
    "french":   { emoji: "🇫🇷", label: "20 min of French" },
    "crossword":{ emoji: "🧩", label: "Crossword" },
    "fact":     { emoji: "💡", label: "Learn something new" },
    "stretch":  { emoji: "🤸", label: "Morning stretch" },
    "lift":     { emoji: "🏋️", label: "Strength training" },
    "cardio":   { emoji: "🏃", label: "Cardio" },
    "diet":     { emoji: "🥗", label: "Dial in my diet" },
    "creatine": { emoji: "💊", label: "Creatine" }
  };

  var FACTS = [
    "Octopuses have three hearts, and two of them stop beating when they swim.",
    "Honey never spoils — sealed jars found in ancient Egyptian tombs are still edible.",
    "A group of flamingos is called a flamboyance.",
    "The Eiffel Tower grows about 6 inches taller in summer as the iron expands.",
    "Bananas are botanically berries, but strawberries aren't.",
    "Wombat droppings are cube-shaped, which keeps them from rolling away.",
    "There are more possible chess games than atoms in the observable universe.",
    "Sea otters hold hands while sleeping so they don't drift apart.",
    "The shortest war in history lasted about 38 minutes (Britain vs. Zanzibar, 1896).",
    "Sharks existed before trees — sharks are about 400 million years old.",
    "A day on Venus is longer than a year on Venus.",
    "Scotland's national animal is the unicorn.",
    "Cows have best friends and get stressed when separated from them.",
    "The dot over a lowercase 'i' or 'j' has a name: a tittle.",
    "Butterflies taste with their feet.",
    "Hot water can freeze faster than cold water under certain conditions — it's called the Mpemba effect.",
    "A single cloud can weigh more than a million pounds.",
    "Jupiter's moon Europa has an ocean with likely twice as much water as Earth.",
    "Slugs have four noses.",
    "The world's oldest known recipe is for beer, from ancient Sumeria.",
    "Wood frogs can survive being frozen solid through winter.",
    "The Great Wall of China is not visible from space with the naked eye — that's a myth.",
    "Starfish don't have brains or blood.",
    "Some turtles breathe through their butts.",
    "Venus is the only planet that spins clockwise.",
    "The longest common word without a vowel is 'rhythms'.",
    "Elephants are one of the few animals that can recognize themselves in a mirror.",
    "A bolt of lightning is roughly five times hotter than the surface of the sun.",

    var m = TASK_META[id];
    return '<div class="content-head" data-id="' + id + '" role="checkbox" tabindex="0" aria-checked="' + !!todayState[id] + '">' +
      checkboxHTML(id) + '<span class="emoji">' + m.emoji + '</span><span class="title">' + m.label + '</span></div>';
  }
  function wireContentHead(tileEl, id) {
    var head = tileEl.querySelector(".content-head");
    register(id, tileEl);
    head.addEventListener("click", function () { toggleTask(id); });
    head.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleTask(id); } });
  }

  // ---- Strength tile: simple yes/no ----
  (function () {
    var tile = document.getElementById("tile-strength");
    tile.innerHTML = contentHead("lift") +
      '<div class="content-body"><div class="lift-note">Whatever’s on today’s plan — just mark it done.</div></div>';
    wireContentHead(tile, "lift");
  })();

  // ---- Cardio tile: pick your mode ----
  (function () {
    var tile = document.getElementById("tile-cardio");
    var CARDIO_OPTIONS = [
      ["hike", "🥾", "Hike"],
      ["run", "🏃", "Run"],
      ["steps", "🔢", "10k steps"]
    ];
    var today = cardioLog[key] || {};

    function anyChecked() { return CARDIO_OPTIONS.some(function (o) { return !!today[o[0]]; }); }

    var html = contentHead("cardio") + '<div class="content-body">';
    html += '<div class="cd-desc">Check off whichever you did today.</div>';
    html += '<div class="cardio-options">';
    CARDIO_OPTIONS.forEach(function (o) {
      html += '<div class="chk-row cardio-opt" data-opt="' + o[0] + '" role="checkbox" tabindex="0" aria-checked="' + !!today[o[0]] + '">' +
        '<div class="chk-box' + (today[o[0]] ? ' done' : '') + '"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>' +
        '<span class="chk-emoji">' + o[1] + '</span><span class="chk-text">' + o[2] + '</span></div>';
    });
    html += '</div></div>';
    tile.innerHTML = html;
    wireContentHead(tile, "cardio");

    tile.querySelectorAll(".cardio-opt").forEach(function (row) {
      function flip() {
        var opt = row.dataset.opt;
        today[opt] = !today[opt];
        cardioLog[key] = today;
        persistDay(key);
        row.querySelector(".chk-box").classList.toggle("done", today[opt]);
        row.setAttribute("aria-checked", !!today[opt]);
        setTaskDone("cardio", anyChecked());
      }
      row.addEventListener("click", flip);
      row.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } });
    });
  })();

  // ---- Poem tile: a real, different poem fetched live every day from PoetryDB ----
  // PoetryDB (poetrydb.org) is a free public-domain poetry API with open CORS,
  // so unlike Poetry Foundation it can actually be fetched from the browser.
  // Picking a poet + title deterministically by date (not randomly) means the
  // poem is stable all day and spans a pool of ~800 poems across 6 poets.
  var POEM_POETS = ["Emily Dickinson", "William Blake", "John Keats", "Percy Bysshe Shelley", "Walt Whitman", "Christina Rossetti"];
  function renderPoem(p, isLive) {
    var tile = document.getElementById("tile-poem");
    tile.innerHTML = contentHead("poem") +
      '<div class="content-body"><div class="poem-title">' + esc(p.title) + '</div>' +
      '<div class="poem-author">' + esc(p.author) + '</div>' +
      '<div class="poem-body">' + esc(p.body) + '</div>' +
      '<div style="margin-top:10px;"><a class="btn-link" href="https://www.poetryfoundation.org/poems/poem-of-the-day" target="_blank" rel="noopener">Also see Poetry Foundation’s pick ↗</a></div>' +
      '<div class="note" style="margin-top:8px;">' + (isLive
        ? "Fetched live from PoetryDB (public domain), picked by today’s date from ~800 poems across 6 poets."
        : "Couldn’t reach PoetryDB — showing a bundled poem instead.") + '</div></div>';
    wireContentHead(tile, "poem");
  }
  (function () {
    var tile = document.getElementById("tile-poem");
    tile.innerHTML = contentHead("poem") + '<div class="content-body"><div class="note">Fetching today’s poem…</div></div>';
    wireContentHead(tile, "poem");

    var poet = POEM_POETS[dayHash("poem-poet:" + key) % POEM_POETS.length];
    fetch("https://poetrydb.org/author/" + encodeURIComponent(poet) + "/title")
      .then(function (r) { if (!r.ok) throw new Error("bad response"); return r.json(); })
      .then(function (titles) {
        if (!Array.isArray(titles) || !titles.length) throw new Error("no titles");
        var title = titles[dayHash("poem-title:" + key) % titles.length].title;
        return fetch("https://poetrydb.org/title/" + encodeURIComponent(title));
      })
      .then(function (r) { if (!r.ok) throw new Error("bad response"); return r.json(); })
      .then(function (poems) {
        var poem = Array.isArray(poems) ? poems[0] : poems;
        if (!poem || !poem.lines || !poem.lines.length) throw new Error("bad poem");
        var lines = poem.lines;
        var body = lines.length > 44 ? lines.slice(0, 44).join("\n") + "\n…" : lines.join("\n");
        renderPoem({ title: poem.title, author: poem.author, body: body }, true);
      })
      .catch(function () {
        renderPoem(POEMS[poemIdx], false);
      });
  })();

  // ---- Verse tile ----
  (function () {
    var v = VERSES[verseIdx];
    var tile = document.getElementById("tile-verse");
    tile.innerHTML = contentHead("pray") +
      '<div class="content-body"><div class="verse-body">“' + esc(v.text) + '”</div>' +
      '<div class="verse-ref">' + esc(v.ref) + '</div>' +
      '<div style="margin-top:10px;"><a class="btn-link" href="https://www.bible.com/verse-of-the-day" target="_blank" rel="noopener">Today’s actual pick on Bible.com ↗</a></div>' +
      '<div class="note" style="margin-top:8px;">Bible.com blocks cross-site fetching too, and matching their exact daily pick needs their official (keyed) API. This rotates a real KJV verse from a curated list instead.</div></div>';
    wireContentHead(tile, "pray");
  })();

  // ---- Stretch tile: Baduanjin qigong set ----
  (function () {
    var tile = document.getElementById("tile-stretch");
    var html = contentHead("stretch") + '<div class="content-body">';
    html += '<div class="cd-desc">Baduanjin, the "Eight Pieces of Brocade" — a standing qigong set practiced for over a thousand years. Move slowly, breathe through the nose, and keep the knees soft throughout. About 10 minutes end to end.</div>';
    html += '<div class="stretch-grid">';
    QIGONG_MOVES.forEach(function (m, i) {
      html += '<div class="qi-row"><div class="qi-head"><span class="qi-num">' + (i + 1) + '</span><span>' + esc(m[0]) + '</span><span class="dur">' + esc(m[1]) + '</span></div>' +
        '<div class="qi-cue">' + esc(m[2]) + '</div></div>';
    });
    html += '</div></div>';
    tile.innerHTML = html;
    wireContentHead(tile, "stretch");
  })();

  // ---- French tile ----
  (function () {
    var f = FRENCH[frIdx];
    var tile = document.getElementById("tile-french");
    var hasVoice = typeof window.speechSynthesis !== "undefined";
    var html = contentHead("french") + '<div class="content-body">';
    html += '<div class="fr-title">' + esc(f.title) + '<span class="fr-level">' + esc(f.level) + '</span></div>';
    html += '<div class="fr-text">' + esc(f.fr) + '</div>';
    html += '<div class="fr-grammar">' + f.grammar + '</div>';
    html += '<div class="fr-translation hidden" data-translation>' + esc(f.en) + '</div>';
    html += '<div class="fr-actions">';
    if (hasVoice) html += '<button class="btn" data-act="speak">🔊 Listen</button>';
    html += '<button class="btn" data-act="translate">Show translation</button></div>';
    html += '<div class="tile-label" style="margin-top:10px;">Vocab &amp; expressions</div><div class="fr-vocab">';
    f.vocab.forEach(function (v) {
      html += '<div class="fr-vocab-row"><span class="fr-word">' + esc(v[0]) + '</span><span class="fr-en">' + esc(v[1]) + '</span></div>';
    });
    html += '</div></div>';
    tile.innerHTML = html;
    wireContentHead(tile, "french");

    var speakBtn = tile.querySelector('[data-act="speak"]');
    if (speakBtn) {
      speakBtn.addEventListener("click", function () {
        try {
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(f.fr);
          u.lang = "fr-FR"; u.rate = 0.9;
          window.speechSynthesis.speak(u);
        } catch (e) {}
      });
    }
    tile.querySelector('[data-act="translate"]').addEventListener("click", function (e) {
      var t = tile.querySelector("[data-translation]");
      var hidden = t.classList.toggle("hidden");
      e.currentTarget.textContent = hidden ? "Show translation" : "Hide translation";
    });
  })();

  // ---- Crossword tile ----
  (function () {
    var puz = pickCrosswordSeeded(key);
    var tile = document.getElementById("tile-crossword");
    var grid = [];
    for (var r = 0; r < 5; r++) grid.push([null, null, null, null, null]);
    for (var r2 = 0; r2 < 5; r2++) grid[r2][2] = puz.down.word[r2];
    var rowsForAcross = [0, 2, 4];
    puz.across.forEach(function (a, i) {
      var row = rowsForAcross[i];
      grid[row][1] = a.word[0]; grid[row][2] = a.word[1]; grid[row][3] = a.word[2];
    });
    var numberAt = { "0,1": 1, "0,2": 2, "2,1": 3, "4,1": 4 };

    var html = contentHead("crossword") + '<div class="content-body">';
    html += '<div class="xw-link-card"><div><div class="xw-lc-title">Today’s full crossword</div><div class="xw-lc-sub">Dictionary.com — Mini, Easy &amp; Sunday puzzles</div></div>' +
      '<a class="btn-link" href="https://www.dictionary.com/games/crossword" target="_blank" rel="noopener">Play ↗</a></div>';
    html += '<div class="tile-label" style="margin-top:2px;">Or a quick warm-up here</div>';
    html += '<div class="xw-row"><div class="xw-grid">';
    for (var r = 0; r < 5; r++) {
      for (var c = 0; c < 5; c++) {
        var letter = grid[r][c];
        if (letter === null) {
          html += '<div class="xw-cell blocked"></div>';
        } else {
          var num = numberAt[r + "," + c];
          html += '<div class="xw-cell">' + (num ? '<span class="xw-num">' + num + '</span>' : '') +
            '<input maxlength="1" data-r="' + r + '" data-c="' + c + '" data-ans="' + letter + '" autocomplete="off" spellcheck="false" aria-label="Row ' + (r + 1) + ' column ' + (c + 1) + '"></div>';
        }
      }
    }
    html += '</div><div class="xw-clues"><b>Across</b>';
    puz.across.forEach(function (a, i) {
      var n = i === 0 ? 1 : i === 1 ? 3 : 4;
      html += '<div>' + n + '. ' + esc(a.clue) + '</div>';
    });
    html += '<b>Down</b><div>2. ' + esc(puz.down.clue) + '</div></div></div>';
    html += '<div class="xw-actions"><button class="btn" data-act="check">Check</button><button class="btn" data-act="reveal">Reveal</button><span class="xw-status" data-status></span></div></div>';
    tile.innerHTML = html;
    wireContentHead(tile, "crossword");

    var inputs = tile.querySelectorAll(".xw-cell input");
    inputs.forEach(function (inp) {
      inp.addEventListener("input", function () {
        inp.value = inp.value.slice(-1).toUpperCase();
        inp.classList.remove("correct", "incorrect");
        if (inp.value) {
          var r = +inp.dataset.r, c = +inp.dataset.c;
          var next = tile.querySelector('.xw-cell input[data-r="' + r + '"][data-c="' + (c + 1) + '"]') ||
                     tile.querySelector('.xw-cell input[data-r="' + (r + 1) + '"][data-c="' + c + '"]');
          if (next) next.focus();
        }
      });
    });
    var status = tile.querySelector("[data-status]");
    tile.querySelector('[data-act="check"]').addEventListener("click", function () {
      var allCorrect = true;
      inputs.forEach(function (inp) {
        var ok = inp.value.toUpperCase() === inp.dataset.ans;
        inp.classList.toggle("correct", ok && !!inp.value);
        inp.classList.toggle("incorrect", !ok && !!inp.value);
        if (!ok) allCorrect = false;
      });
      status.textContent = allCorrect ? "Solved!" : "Keep going";
    });
    tile.querySelector('[data-act="reveal"]').addEventListener("click", function () {
      inputs.forEach(function (inp) {
        inp.value = inp.dataset.ans; inp.classList.add("correct"); inp.classList.remove("incorrect");
      });
      status.textContent = "Solved!";
    });
  })();

  // ---- Fact tile ----
  (function () {
    var tile = document.getElementById("tile-fact");
    function render() {
      tile.innerHTML = contentHead("fact") +
        '<div class="content-body"><div class="fact-text" id="factText">' + esc(FACTS[factIdx]) + '</div>' +
        '<div class="fact-actions"><button class="btn" id="factShuffle">Shuffle</button></div></div>';
      wireContentHead(tile, "fact");
      tile.querySelector("#factShuffle").addEventListener("click", function () {
        var next = factIdx;
        while (next === factIdx) next = Math.floor(Math.random() * FACTS.length);
        factIdx = next;
        render();
      });
    }
    render();
  })();

  // ---- initial pass: instantly hide anything already done today ----
  ALL_TASK_IDS.forEach(function (id) {
    if (todayState[id]) {
      var reg = registry[id];
      if (reg) reg.unit.style.display = "none";
      addChip(id);
    }
  });

  // ---- progress / streak / history ----
  function allTasksDone(state) { return ALL_TASK_IDS.every(function (id) { return state[id]; }); }
  function renderProgress() {
    var done = ALL_TASK_IDS.filter(function (id) { return todayState[id]; }).length;
    document.getElementById("doneCount").textContent = done;
    document.getElementById("totalCount").textContent = ALL_TASK_IDS.length;
    document.getElementById("barFill").style.width = Math.round((done / ALL_TASK_IDS.length) * 100) + "%";
    document.getElementById("navSub").textContent = done + " of " + ALL_TASK_IDS.length + " priorities handled";
  }
  function computeStreak() {
    var streak = 0;
    var d = new Date();
    if (!allTasksDone(todayState)) d.setDate(d.getDate() - 1);
    while (true) {
      var k = todayKey(d);
      var dayState = store[k];
      if (dayState && allTasksDone(dayState)) { streak++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return streak;
  }
  function renderHistory() {
    var el = document.getElementById("history");
    el.innerHTML = "";
    for (var i = 13; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var k = todayKey(d);
      var dayState = store[k] || {};
      var doneN = ALL_TASK_IDS.filter(function (id) { return dayState[id]; }).length;
      var ratio = doneN === 0 ? "none" : doneN === ALL_TASK_IDS.length ? "full" : doneN >= ALL_TASK_IDS.length / 2 ? "mid" : "low";
      var div = document.createElement("div");
      div.className = "day" + (i === 0 ? " today" : "");
      div.setAttribute("data-ratio", ratio);
      div.title = d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ": " + doneN + "/" + ALL_TASK_IDS.length;
      el.appendChild(div);
    }
    var streak = computeStreak();
    document.getElementById("streakNum").textContent = streak;
    document.getElementById("navSub").textContent += " · " + streak + "-day streak";
  }

  // ---- History tab ----
  function renderHistoryTab() {
    var el = document.getElementById("historyList");
    var dates = Object.keys(store).sort().reverse();
    if (dates.length === 0) {
      el.innerHTML = '<div class="hist-empty">Nothing recorded yet.</div>';
      return;
    }
    var html = "";
    dates.forEach(function (k) {
      var dayState = store[k];
      var doneIds = ALL_TASK_IDS.filter(function (id) { return dayState[id]; });
      var d = new Date(k + "T00:00:00");
      var label = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
      html += '<div class="hist-day"><div class="hist-day-head"><span class="hist-day-date">' + label + '</span>' +
        '<span class="hist-day-count">' + doneIds.length + '/' + ALL_TASK_IDS.length + '</span></div>';
      if (doneIds.length === 0) {
        html += '<div class="hist-empty">Nothing completed.</div>';
      } else {
        html += '<div class="hist-chips">';
        doneIds.forEach(function (id) {
          var m = TASK_META[id];
          html += '<span class="hist-chip">' + m.emoji + ' ' + esc(m.label) + '</span>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    el.innerHTML = html;
  }

  var tabToday = document.getElementById("tabToday");
  var tabHistory = document.getElementById("tabHistory");
  var viewToday = document.getElementById("view-today");
  var viewHistory = document.getElementById("view-history");
  tabToday.addEventListener("click", function () {
    tabToday.classList.add("active"); tabHistory.classList.remove("active");
    viewToday.style.display = ""; viewHistory.style.display = "none";
  });
  tabHistory.addEventListener("click", function () {
    tabHistory.classList.add("active"); tabToday.classList.remove("active");
    viewToday.style.display = "none"; viewHistory.style.display = "";
    renderHistoryTab();
  });

  renderProgress();
  renderHistory();
  }
})();
</script>
</body>
</html>
