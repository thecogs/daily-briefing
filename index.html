<title>Daily Briefing</title>

<style>
  :root {
    --bg: #f0efe9;
    --surface: #ffffff;
    --surface-soft: #f7f5f0;
    --border: #e1ddd0;
    --ink: #17160f;
    --ink-soft: #6b6656;
    --ink-faint: #a49e8b;
    --accent: #17324f;
    --accent-2: #a97b2f;
    --accent-2-wash: #f3e6cf;
    --accent-dark: #0d1f33;
    --accent-wash: #e7edf1;
    --success: #2f6b4f;
    --success-wash: #e5f0e9;
    --bad: #a3352b;
    --bad-wash: #f6e6e4;
    --shadow: 0 1px 2px rgba(23,22,15,0.06), 0 1px 1px rgba(23,22,15,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12131a; --surface: #1b1c24; --surface-soft: #21222b; --border: #33343e;
      --ink: #eeece4; --ink-soft: #aaa79a; --ink-faint: #726e60;
      --accent: #6f9bc4; --accent-2: #d8ab5f; --accent-2-wash: #33291a;
      --accent-dark: #0d1f33; --accent-wash: #1b2b3a;
      --success: #57b487; --success-wash: #15301f;
      --bad: #e0776a; --bad-wash: #341814;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 1px 1px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12131a; --surface: #1b1c24; --surface-soft: #21222b; --border: #33343e;
    --ink: #eeece4; --ink-soft: #aaa79a; --ink-faint: #726e60;
    --accent: #6f9bc4; --accent-2: #d8ab5f; --accent-2-wash: #33291a;
    --accent-dark: #0d1f33; --accent-wash: #1b2b3a;
    --success: #57b487; --success-wash: #15301f;
    --bad: #e0776a; --bad-wash: #341814;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 1px 1px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh; padding: 20px 16px 56px;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .navbar {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff; border-radius: 6px; padding: 20px 24px;
    display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px;
    box-shadow: var(--shadow);
  }
  .navbar-eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.14em; opacity: 0.65; font-family: "IBM Plex Mono", monospace; margin-bottom: 4px; }
  .navbar h1 { font-family: "Fraunces", Georgia, serif; font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .navbar .navsub { font-size: 12.5px; opacity: 0.8; margin-top: 5px; font-family: "IBM Plex Mono", monospace; }
  .navbar .date { font-size: 12.5px; opacity: 0.75; font-family: "IBM Plex Mono", monospace; text-align: right; }

  .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .span-1 { grid-column: span 1; }
  .span-2 { grid-column: span 2; }
  .span-4 { grid-column: span 4; }
  @media (max-width: 860px) { .dashboard { grid-template-columns: repeat(2, 1fr); } .span-4 { grid-column: span 2; } }
  @media (max-width: 520px) { .dashboard { grid-template-columns: 1fr; } .span-1, .span-2, .span-4 { grid-column: span 1; } }

  .section-eyebrow {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-faint); padding: 4px 2px 0; display: flex; align-items: center; gap: 10px;
  }
  .section-eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: var(--shadow); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .tile-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); }

  .stat-num { font-family: "IBM Plex Mono", monospace; font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent-2); line-height: 1; }
  .stat-sub { font-size: 12.5px; color: var(--ink-soft); }
  .stat-bar { height: 7px; border-radius: 999px; background: var(--surface-soft); overflow: hidden; margin-top: 2px; }
  .stat-bar-fill { height: 100%; background: var(--accent-2); border-radius: 999px; width: 0%; transition: width 0.4s ease; }
  @media (prefers-reduced-motion: reduce) { .stat-bar-fill { transition: none; } }
  .history { display: flex; gap: 4px; align-items: flex-end; flex: 1; }
  .history .day { flex: 1; height: 30px; border-radius: 3px; background: var(--surface-soft); }
  .history .day[data-ratio="full"] { background: var(--success); }
  .history .day[data-ratio="mid"] { background: var(--accent-2); opacity: 0.6; }
  .history .day[data-ratio="low"] { background: var(--accent-2); opacity: 0.28; }
  .history .day.today { box-shadow: inset 0 0 0 2px var(--accent-dark); }

  .chk-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; -webkit-tap-highlight-color: transparent; overflow: hidden; }
  .chk-box { flex: none; width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--ink-faint); display: flex; align-items: center; justify-content: center; }
  .chk-box svg { width: 11px; height: 11px; opacity: 0; }
  .chk-box.done { background: var(--success); border-color: var(--success); }
  .chk-box.done svg { opacity: 1; }
  .chk-emoji { font-size: 15px; }
  .chk-text { font-size: 14px; font-weight: 500; }
  .chk-row:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .content-head { display: flex; align-items: center; gap: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .content-head .title { font-size: 15px; font-weight: 600; }
  .content-head .emoji { font-size: 17px; }
  .content-body { overflow: hidden; }

  button.btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--accent);
    border-radius: 5px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  button.btn:hover { background: var(--accent-wash); }
  button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.btn.primary:hover { opacity: 0.92; }

  a.btn-link {
    display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff;
    border-radius: 5px; padding: 8px 14px; font-size: 13px; font-weight: 600; text-decoration: none;
  }
  a.btn-link:hover { opacity: 0.9; }

  .poem-title { font-family: "Fraunces", Georgia, serif; font-size: 18px; font-weight: 600; margin: 4px 0 0; }
  .poem-author { font-size: 12px; color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; margin-bottom: 6px; }
  .poem-body { font-family: "Fraunces", Georgia, serif; font-size: 15px; line-height: 1.7; white-space: pre-line; }
  .verse-body { font-family: "Fraunces", Georgia, serif; font-size: 15.5px; line-height: 1.7; font-style: italic; }
  .verse-ref { font-size: 12.5px; color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; font-style: normal; margin-top: 4px; }

  .video-card {
    position: relative; border-radius: 6px; overflow: hidden;
    background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: #fff;
    padding: 22px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center; min-height: 110px;
  }
  .video-play { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; }
  .video-play svg { width: 18px; height: 18px; }
  .video-card .vc-title { font-weight: 600; font-size: 15px; }
  .video-card .vc-sub { font-size: 12px; opacity: 0.85; }
  .stretch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 6px; margin-top: 4px; }
  .stretch-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .stretch-row .dur { font-family: "IBM Plex Mono", monospace; color: var(--ink-soft); font-size: 12.5px; }
  .note { font-size: 11.5px; color: var(--ink-faint); }

  /* ---------- Strength tile ---------- */
  .split-badge { display: inline-block; background: var(--accent-2-wash); color: var(--accent-2); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 9px; border-radius: 999px; }
  .lift-name { font-family: "Fraunces", Georgia, serif; font-size: 19px; font-weight: 600; margin-top: 8px; }
  .lift-scheme { font-size: 13.5px; color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; margin-top: 2px; }
  .lift-note { font-size: 13px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
  .log-row { display: flex; gap: 8px; margin-top: 12px; }
  .log-row input {
    flex: 1; min-width: 0; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 5px;
    padding: 8px 10px; font-size: 14px; color: var(--ink); font-family: "IBM Plex Mono", monospace;
  }
  .lift-delta { font-size: 12.5px; color: var(--accent); font-weight: 600; margin-top: 8px; font-family: "IBM Plex Mono", monospace; }
  .lift-delta.neg { color: var(--bad); }

  /* ---------- Cardio / Norwegian 4x4 ---------- */
  .cd-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.55; }
  .cd-panel { background: var(--surface-soft); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .cd-kind { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding: 3px 10px; border-radius: 999px; }
  .cd-kind.high { background: var(--accent-2-wash); color: var(--accent-2); }
  .cd-kind.low { background: var(--accent-wash); color: var(--accent); }
  .cd-phase { font-size: 15px; font-weight: 600; }
  .cd-clock { font-family: "IBM Plex Mono", monospace; font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .cd-segments { display: flex; gap: 3px; width: 100%; }
  .cd-seg { flex: 1; height: 6px; border-radius: 999px; background: var(--border); }
  .cd-seg.done { background: var(--success); }
  .cd-seg.now.high { background: var(--accent-2); }
  .cd-seg.now.low { background: var(--accent); }
  .cd-controls { display: flex; gap: 8px; }
  .cd-status { font-size: 12.5px; color: var(--success); font-weight: 600; }

  .xw-link-card {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--accent-wash); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px;
  }
  .xw-link-card .xw-lc-title { font-weight: 600; font-size: 14px; }
  .xw-link-card .xw-lc-sub { font-size: 12px; color: var(--ink-soft); }
  .xw-grid { display: grid; grid-template-columns: repeat(5, 36px); grid-template-rows: repeat(5, 36px); gap: 3px; }
  .xw-cell { position: relative; }
  .xw-cell.blocked { background: transparent; }
  .xw-cell input {
    width: 100%; height: 100%; text-align: center; font-size: 16px; font-weight: 600; text-transform: uppercase;
    background: var(--surface-soft); border: 1px solid var(--border); border-radius: 3px;
    color: var(--ink); padding: 0; font-family: "IBM Plex Mono", monospace;
  }
  .xw-cell input:focus { border-color: var(--accent); outline: none; }
  .xw-cell input.correct { background: var(--success-wash); border-color: var(--success); }
  .xw-cell input.incorrect { border-color: var(--bad); }
  .xw-num { position: absolute; top: 1px; left: 2px; font-size: 8px; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; pointer-events: none; }
  .xw-clues { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
  .xw-clues b { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-top: 6px; }
  .xw-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .xw-actions { display: flex; gap: 8px; align-items: center; }
  .xw-status { font-size: 12.5px; color: var(--success); font-weight: 600; }

  .fr-level { display: inline-block; background: var(--accent-2-wash); color: var(--accent-2); font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
  .fr-title { font-weight: 600; font-size: 15px; margin: 2px 0 4px; }
  .fr-text { font-size: 14.5px; line-height: 1.6; }
  .fr-grammar { font-size: 12.5px; background: var(--surface-soft); border-left: 3px solid var(--accent); padding: 7px 10px; margin-top: 8px; border-radius: 0 4px 4px 0; color: var(--ink-soft); }
  .fr-grammar b { color: var(--ink); }
  .fr-translation { font-size: 13px; color: var(--ink-soft); line-height: 1.55; margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border); }
  .fr-translation.hidden { display: none; }
  .fr-actions { display: flex; gap: 8px; margin-top: 8px; }
  .fr-vocab { display: flex; flex-direction: column; }
  .fr-vocab-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .fr-vocab-row:last-child { border-bottom: none; }
  .fr-vocab-row .fr-word { font-weight: 500; }
  .fr-vocab-row .fr-en { color: var(--ink-soft); }

  .fact-text { font-size: 14px; line-height: 1.55; }
  .fact-actions { display: flex; justify-content: flex-end; }

  #tile-completed { display: none; }
  #tile-completed.show { display: flex; }
  .done-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .done-chip {
    display: flex; align-items: center; gap: 6px; background: var(--surface-soft); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 10px 5px 8px; font-size: 12.5px; cursor: pointer;
  }
  .done-chip:hover { background: var(--success-wash); }
  .done-chip .dc-check { color: var(--success); font-size: 13px; }
  .done-chip .dc-text { color: var(--ink-soft); text-decoration: line-through; }
</style>

<div class="page">
  <div class="navbar">
    <div>
      <div class="navbar-eyebrow">Daily Briefing</div>
      <h1 id="greeting">Good morning.</h1>
      <div class="navsub" id="navSub"></div>
    </div>
    <div class="date" id="dateLine"></div>
  </div>

  <div class="dashboard">
    <div class="tile span-1">
      <div class="tile-label">Today</div>
      <div class="stat-num"><span id="doneCount">0</span><span style="font-size:16px;color:var(--ink-faint);">/<span id="totalCount">14</span></span></div>
      <div class="stat-bar"><div class="stat-bar-fill" id="barFill"></div></div>
    </div>
    <div class="tile span-1">
      <div class="tile-label">Streak</div>
      <div class="stat-num" id="streakNum">0</div>
      <div class="stat-sub">days complete</div>
    </div>
    <div class="tile span-2">
      <div class="tile-label">Last 14 days</div>
      <div class="history" id="history"></div>
    </div>

    <div class="section-eyebrow span-4">Physical performance</div>
    <div class="tile span-2" id="tile-strength"></div>
    <div class="tile span-2" id="tile-cardio"></div>
    <div class="tile span-4" id="tile-stretch"></div>

    <div class="section-eyebrow span-4">Mind &amp; spirit</div>
    <div class="tile span-2" id="tile-poem"></div>
    <div class="tile span-2" id="tile-verse"></div>
    <div class="tile span-2" id="tile-french"></div>
    <div class="tile span-2" id="tile-crossword"></div>
    <div class="tile span-2" id="tile-fact"></div>
    <div class="tile span-2" id="tile-checklist"></div>

    <div class="tile span-4" id="tile-completed">
      <div class="tile-label">Completed today</div>
      <div class="done-list" id="doneList"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = "morning-ledger-v6";
  var IDX_KEY = "morning-ledger-idx-v6";

  var ALL_TASK_IDS = ["make-bed","shower","pray","book","journal","poem","french","crossword","fact","stretch","lift","cardio","diet","creatine"];

    "book":     { emoji: "📖", label: "Read a book" },
    "journal":  { emoji: "📓", label: "Journal" },

    "cardio":   { emoji: "🏃", label: "Cardio — Norwegian 4×4" },
    "diet":     { emoji: "🥗", label: "Dial in my diet" },

  };

  var FACTS = [
    "Octopuses have three hearts, and two of them stop beating when they swim.",
    "Honey never spoils — sealed jars found in ancient Egyptian tombs are still edible.",
    "A group of flamingos is called a flamboyance.",
    "The Eiffel Tower grows about 6 inches taller in summer as the iron expands.",
    "Bananas are botanically berries, but strawberries aren't.",
    "Wombat droppings are cube-shaped, which keeps them from rolling away.",
    "There are more possible chess games than atoms in the observable universe.",
    "Sea otters hold hands while sleeping so they don't drift apart.",
    "The shortest war in history lasted about 38 minutes (Britain vs. Zanzibar, 1896).",

  ];

  var POEMS = [
    { title: "The Road Not Taken", author: "Robert Frost",
      body: "Two roads diverged in a yellow wood,\nAnd sorry I could not travel both\nAnd be one traveler, long I stood\nAnd looked down one as far as I could\nTo where it bent in the undergrowth;\n\nThen took the other, as just as fair,\nAnd having perhaps the better claim,\nBecause it was grassy and wanted wear;\nThough as for that the passing there\nHad worn them really about the same,\n\nAnd both that morning equally lay\nIn leaves no step had trodden black.\nOh, I kept the first for another day!\nYet knowing how way leads on to way,\nI doubted if I should ever come back.\n\nI shall be telling this with a sigh\nSomewhere ages and ages hence:\nTwo roads diverged in a wood, and I—\nI took the one less traveled by,\nAnd that has made all the difference." },
    { title: "The Tyger", author: "William Blake",
      body: "Tyger Tyger, burning bright,\nIn the forests of the night,\nWhat immortal hand or eye\nCould frame thy fearful symmetry?\n\nIn what distant deeps or skies\nBurnt the fire of thine eyes?\nOn what wings dare he aspire?\nWhat the hand dare seize the fire?\n\nAnd what shoulder, and what art,\nCould twist the sinews of thy heart?\nAnd when thy heart began to beat,\nWhat dread hand? and what dread feet?\n\nWhat the hammer? what the chain?\nIn what furnace was thy brain?\nWhat the anvil? What dread grasp\nDare its deadly terrors clasp?\n\nWhen the stars threw down their spears,\nAnd water'd heaven with their tears,\nDid he smile his work to see?\nDid he who made the Lamb make thee?\n\nTyger Tyger, burning bright,\nIn the forests of the night,\nWhat immortal hand or eye,\nDare frame thy fearful symmetry?" },
    { title: "Nothing Gold Can Stay", author: "Robert Frost",
      body: "Nature's first green is gold,\nHer hardest hue to hold.\nHer early leaf's a flower;\nBut only so an hour.\nThen leaf subsides to leaf.\nSo Eden sank to grief,\nSo dawn goes down to day.\nNothing gold can stay." },
    { title: "“Hope” is the thing with feathers", author: "Emily Dickinson",

    var phaseIdx = 0, remaining = CARDIO_PHASES[0].seconds, timerId = null, audioCtx = null;

    function getCtx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
      }
      return audioCtx;
    }
    function beep(freq, dur) {
      var ctx = getCtx();
      if (!ctx) return;
      try {
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain); gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
        osc.start(); osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

      var phase = CARDIO_PHASES[phaseIdx];
      tile.querySelector("#cdPhase").textContent = phase.label;

        seg.classList.toggle("done", i < phaseIdx);
        seg.classList.remove("now", "high", "low");
        if (i === phaseIdx) seg.classList.add("now", phase.kind);

    }

      running = false;
      clearInterval(timerId);
      tile.querySelector("#cdStart").disabled = false;

    if (hasVoice) html += '<button class="btn" data-act="speak">🔊 Listen</button>';
    html += '<button class="btn" data-act="translate">Show translation</button></div>';
    html += '<div class="tile-label" style="margin-top:10px;">Vocab &amp; expressions</div><div class="fr-vocab">';
    f.vocab.forEach(function (v) {
      html += '<div class="fr-vocab-row"><span class="fr-word">' + esc(v[0]) + '</span><span class="fr-en">' + esc(v[1]) + '</span></div>';
    });
    html += '</div></div>';
    tile.innerHTML = html;
    wireContentHead(tile, "french");

    var speakBtn = tile.querySelector('[data-act="speak"]');
    if (speakBtn) {
      speakBtn.addEventListener("click", function () {
        try {
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(f.fr);
          u.lang = "fr-FR"; u.rate = 0.9;
          window.speechSynthesis.speak(u);
        } catch (e) {}
      });
    }
    tile.querySelector('[data-act="translate"]').addEventListener("click", function (e) {
      var t = tile.querySelector("[data-translation]");
      var hidden = t.classList.toggle("hidden");
      e.currentTarget.textContent = hidden ? "Show translation" : "Hide translation";
    });
  })();

  // ---- Crossword tile ----
  (function () {
    var puz = XWORDS[xwIdx];
    var tile = document.getElementById("tile-crossword");
    var grid = [];
    for (var r = 0; r < 5; r++) grid.push([null, null, null, null, null]);
    for (var r2 = 0; r2 < 5; r2++) grid[r2][2] = puz.down.word[r2];
    var rowsForAcross = [0, 2, 4];
    puz.across.forEach(function (a, i) {
      var row = rowsForAcross[i];
      grid[row][1] = a.word[0]; grid[row][2] = a.word[1]; grid[row][3] = a.word[2];
    });
    var numberAt = { "0,1": 1, "0,2": 2, "2,1": 3, "4,1": 4 };

    var html = contentHead("crossword") + '<div class="content-body">';
    html += '<div class="xw-link-card"><div><div class="xw-lc-title">Today’s full crossword</div><div class="xw-lc-sub">Dictionary.com — Mini, Easy &amp; Sunday puzzles</div></div>' +
      '<a class="btn-link" href="https://www.dictionary.com/games/crossword" target="_blank" rel="noopener">Play ↗</a></div>';
    html += '<div class="tile-label" style="margin-top:2px;">Or a quick warm-up here</div>';
    html += '<div class="xw-row"><div class="xw-grid">';
    for (var r = 0; r < 5; r++) {
      for (var c = 0; c < 5; c++) {
        var letter = grid[r][c];
        if (letter === null) {
          html += '<div class="xw-cell blocked"></div>';
        } else {
          var num = numberAt[r + "," + c];
          html += '<div class="xw-cell">' + (num ? '<span class="xw-num">' + num + '</span>' : '') +
            '<input maxlength="1" data-r="' + r + '" data-c="' + c + '" data-ans="' + letter + '" autocomplete="off" spellcheck="false" aria-label="Row ' + (r + 1) + ' column ' + (c + 1) + '"></div>';
        }
      }
    }
    html += '</div><div class="xw-clues"><b>Across</b>';
    puz.across.forEach(function (a, i) {
      var n = i === 0 ? 1 : i === 1 ? 3 : 4;
      html += '<div>' + n + '. ' + esc(a.clue) + '</div>';
    });
    html += '<b>Down</b><div>2. ' + esc(puz.down.clue) + '</div></div></div>';
    html += '<div class="xw-actions"><button class="btn" data-act="check">Check</button><button class="btn" data-act="reveal">Reveal</button><span class="xw-status" data-status></span></div></div>';
    tile.innerHTML = html;
    wireContentHead(tile, "crossword");

    var inputs = tile.querySelectorAll(".xw-cell input");
    inputs.forEach(function (inp) {
      inp.addEventListener("input", function () {
        inp.value = inp.value.slice(-1).toUpperCase();
        inp.classList.remove("correct", "incorrect");
        if (inp.value) {
          var r = +inp.dataset.r, c = +inp.dataset.c;
          var next = tile.querySelector('.xw-cell input[data-r="' + r + '"][data-c="' + (c + 1) + '"]') ||
                     tile.querySelector('.xw-cell input[data-r="' + (r + 1) + '"][data-c="' + c + '"]');
          if (next) next.focus();
        }
      });
    });
    var status = tile.querySelector("[data-status]");
    tile.querySelector('[data-act="check"]').addEventListener("click", function () {
      var allCorrect = true;
      inputs.forEach(function (inp) {
        var ok = inp.value.toUpperCase() === inp.dataset.ans;
        inp.classList.toggle("correct", ok && !!inp.value);
        inp.classList.toggle("incorrect", !ok && !!inp.value);
        if (!ok) allCorrect = false;
      });
      status.textContent = allCorrect ? "Solved!" : "Keep going";
    });
    tile.querySelector('[data-act="reveal"]').addEventListener("click", function () {
      inputs.forEach(function (inp) {
        inp.value = inp.dataset.ans; inp.classList.add("correct"); inp.classList.remove("incorrect");
      });
      status.textContent = "Solved!";
    });
  })();

  // ---- Fact tile ----
  (function () {
    var tile = document.getElementById("tile-fact");
    function render() {
      tile.innerHTML = contentHead("fact") +
        '<div class="content-body"><div class="fact-text" id="factText">' + esc(FACTS[factIdx]) + '</div>' +
        '<div class="fact-actions"><button class="btn" id="factShuffle">Shuffle</button></div></div>';
      wireContentHead(tile, "fact");
      tile.querySelector("#factShuffle").addEventListener("click", function () {
        var next = factIdx;
        while (next === factIdx) next = Math.floor(Math.random() * FACTS.length);
        factIdx = next;
        render();
      });
    }
    render();
  })();

  // ---- initial pass: instantly hide anything already done today ----
  ALL_TASK_IDS.forEach(function (id) {
    if (todayState[id]) {
      var reg = registry[id];
      if (reg) reg.unit.style.display = "none";
      addChip(id);
    }
  });

  // ---- progress / streak / history ----
  function allTasksDone(state) { return ALL_TASK_IDS.every(function (id) { return state[id]; }); }
  function renderProgress() {
    var done = ALL_TASK_IDS.filter(function (id) { return todayState[id]; }).length;
    document.getElementById("doneCount").textContent = done;
    document.getElementById("totalCount").textContent = ALL_TASK_IDS.length;
    document.getElementById("barFill").style.width = Math.round((done / ALL_TASK_IDS.length) * 100) + "%";
    document.getElementById("navSub").textContent = done + " of " + ALL_TASK_IDS.length + " priorities handled";
  }
  function computeStreak() {
    var streak = 0;
    var d = new Date();
    if (!allTasksDone(todayState)) d.setDate(d.getDate() - 1);
    while (true) {
      var k = todayKey(d);
      var dayState = store[k];
      if (dayState && allTasksDone(dayState)) { streak++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return streak;
  }
  function renderHistory() {
    var el = document.getElementById("history");
    el.innerHTML = "";
    for (var i = 13; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var k = todayKey(d);
      var dayState = store[k] || {};
      var doneN = ALL_TASK_IDS.filter(function (id) { return dayState[id]; }).length;
      var ratio = doneN === 0 ? "none" : doneN === ALL_TASK_IDS.length ? "full" : doneN >= ALL_TASK_IDS.length / 2 ? "mid" : "low";
      var div = document.createElement("div");
      div.className = "day" + (i === 0 ? " today" : "");
      div.setAttribute("data-ratio", ratio);
      div.title = d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ": " + doneN + "/" + ALL_TASK_IDS.length;
      el.appendChild(div);
    }
    var streak = computeStreak();
    document.getElementById("streakNum").textContent = streak;
    document.getElementById("navSub").textContent += " · " + streak + "-day streak";
  }

  renderProgress();
  renderHistory();
})();
</script>
